plugins {
    id "net.fabricmc.fabric-loom" version "1.18.0-alpha.19"
}

group = "me.octo"
version = "1.0.0"

base {
    archivesName = "polinex"
}

loom {
    // Single source set: the decompiled codebase mixes main and client code
    // exactly like the original artifact did.
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:26.1.2"
    // 26.1.2 metadata has no official-Mojang mappings endpoint; compile
    // against the published runtime API names like the original artifact.
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.155.2+26.1.2"
    // Kotlin stdlib is NOT shaded in the original artifact (it came from
    // fabric-language-kotlin at runtime); required on the compile classpath.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.3.20"
    // fabric.mod.json declares a hard dependency on fabric-language-kotlin, so the dev
    // client refuses to resolve the mod without it. No `mappings` configuration exists in
    // this project, so loom's `modRuntimeOnly` is unavailable; a plain runtimeOnly entry
    // still lands the jar on the dev classpath, where FabricLoader discovers it as a mod.
    runtimeOnly "net.fabricmc:fabric-language-kotlin:1.13.10+kotlin.2.3.20"
    // Referenced by decompiled sources; present on the original runtime
    // classpath but not shaded into the artifact.
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"
    compileOnly "org.graalvm.polyglot:polyglot:24.2.2"
    compileOnly "org.projectlombok:lombok:1.18.36"

    // Third-party libraries that the original JAR shaded verbatim
    // (kotlin stdlib/coroutines, okhttp, javassist, dev.jnic loader, ...).
    // Kept as a binary dependency: the statement excludes these packages
    // from restoration, so they are not decompiled into sources.
    implementation files("libs/polinex-deps.jar")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Allow A/B testing decompiler outputs without moving files:
//   gradle compileJava            -> src/main/java (Vineflower base)
//   gradle compileJava -PpxSrc=.. -> alternate tree (e.g. CFR output)
def pxSrc = project.findProperty("pxSrc")?.toString()
if (pxSrc != null) {
    sourceSets {
        main {
            java.srcDirs = [file(pxSrc)]
            resources.srcDirs = ["src/main/resources"]
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
    // Decompiled output is not warning-clean; keep the build signal readable.
    options.compilerArgs += ["-Xlint:none", "-nowarn", "-Xmaxerrs", "100000", "-Xmaxwarns", "0"]
}
