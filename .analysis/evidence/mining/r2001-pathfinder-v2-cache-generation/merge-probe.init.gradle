            options.release = 25
            options.encoding = 'UTF-8'
        }
        tasks.register('runPathfinderMergeProbe', JavaExec) {
            dependsOn tasks.named('compilePathfinderMergeProbe')
            classpath = files(rootProject.file('../.analysis/evidence/mining/r2001-pathfinder-v2-cache-generation/index-shim-classes')) + sourceSets.main.runtimeClasspath + files(rootProject.file('../.analysis/evidence/mining/r2001-pathfinder-v2-cache-generation/merge-probe-classes'))
            mainClass = 'PathfinderChunkMergeDifferentialProbe'
            args new File(rootProject.projectDir, '../../../.analysis/cracked.jar').canonicalPath,
                 rootProject.file('build/classes/java/main').absolutePath,
                 rootProject.file('../.analysis/evidence/mining/r2001-pathfinder-v2-cache-generation/fixtures').absolutePath,
                 rootProject.file('../.analysis/evidence/mining/r2001-pathfinder-v2-cache-generation/index-shim-classes').absolutePath
