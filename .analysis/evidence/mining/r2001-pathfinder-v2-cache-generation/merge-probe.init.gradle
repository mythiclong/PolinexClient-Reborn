            destinationDirectory = rootProject.file('../.analysis/evidence/mining/r2001-pathfinder-v2-cache-generation/index-shim-classes')
            classpath = files()
            options.release = 25
            options.encoding = 'UTF-8'
        }
        tasks.register('compilePathfinderMergeProbe', JavaCompile) {
            dependsOn tasks.named('compileJava'), tasks.named('compilePathfinderIndexShim')
            source = files(rootProject.file('../.analysis/evidence/mining/r2001-pathfinder-v2-cache-generation/PathfinderChunkMergeDifferentialProbe.java'))
            destinationDirectory = rootProject.file('../.analysis/evidence/mining/r2001-pathfinder-v2-cache-generation/merge-probe-classes')
