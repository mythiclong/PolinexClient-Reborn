            dependsOn tasks.named('compilePathfinderCacheGeneratorProbe')
            classpath = files(rootProject.file('../.analysis/evidence/mining/r2001-pathfinder-v2-cache-generation/index-shim-classes')) + sourceSets.main.runtimeClasspath + files(rootProject.file('../.analysis/evidence/mining/r2001-pathfinder-v2-cache-generation/generator-probe-classes'))
            mainClass = 'me.octo.client.PathfinderCacheGeneratorProbe'
            args rootProject.file('../.analysis/evidence/mining/r2001-pathfinder-v2-cache-generation/fixtures').absolutePath,
